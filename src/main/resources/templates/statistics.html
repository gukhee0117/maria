<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/admin/statistics.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">통계보드</div>

<div layout:fragment="content" class="adm-page statistics">
    <section class="adm-screen">
        <div class="adm-screen-head">
            <h1 class="adm-screen-title"><span class="adm-screen-no">[9001]</span> 통계보드</h1>
            <span class="adm-screen-path">시스템 &gt; 통계보드</span>
        </div>

        <!-- 요약: 세제혜택 적용 계좌만 API(account-benefit)에서 오고, 나머지 둘은 API 가 없어 "-" (준비 중) -->
        <div class="adm-summary" id="statSummary">
            <div class="adm-summary-item">
                <span class="adm-summary-label">세제혜택 적용 계좌</span>
                <span class="adm-summary-value" id="statSummaryApplied">-</span>
                <span class="adm-summary-unit">계좌</span>
            </div>
            <div class="adm-summary-item" title="준비 중">
                <span class="adm-summary-label">평균 복귀 금액</span>
                <span class="adm-summary-value" id="statSummaryAverage">-</span>
                <span class="adm-summary-unit">원</span>
            </div>
            <div class="adm-summary-item" title="준비 중">
                <span class="adm-summary-label">이번 달 신규</span>
                <span class="adm-summary-value" id="statSummaryNew">-</span>
                <span class="adm-summary-unit">계좌</span>
            </div>
        </div>
    </section>

    <section class="adm-statbar">
        <label class="adm-statfield" for="statFilterKeyword">계좌·고객
            <input id="statFilterKeyword" class="adm-input" type="text"
                   placeholder="계좌번호 또는 고객명" autocomplete="off">
        </label>
        <label class="adm-statfield" for="statFilterProductName">종목
            <input id="statFilterProductName" class="adm-input" type="text"
                   placeholder="종목명" autocomplete="off">
        </label>
        <div class="adm-statfield adm-statfield-range">기간
            <input id="statFilterStartDate" class="adm-input" type="date" aria-label="기간 시작">
            <span>~</span>
            <input id="statFilterEndDate" class="adm-input" type="date" aria-label="기간 끝">
        </div>
        <div class="adm-statbar-spacer"></div>
        <div class="adm-qbtns">
            <button type="button" id="statFilterSearch" class="adm-btn adm-btn-primary adm-btn-md">조회</button>
            <button type="button" id="statFilterReset" class="adm-btn adm-btn-md">초기화</button>
        </div>
    </section>

    <p id="dashStatError" class="adm-stat-error" hidden></p>

    <!-- KPI 줄: API 가 없어 값은 "-" (준비 중) -->
    <section class="adm-kpis" id="statKpis">
        <div class="adm-kpi" title="준비 중">
            <div class="adm-kpi-label">고객 신청 처리 현황</div>
            <div class="adm-kpi-value">-</div>
            <div class="adm-kpi-sub">-</div>
        </div>
        <div class="adm-kpi" title="준비 중">
            <div class="adm-kpi-label">국내 재투자 계좌</div>
            <div class="adm-kpi-value">-</div>
            <div class="adm-kpi-sub">-</div>
        </div>
        <div class="adm-kpi" title="준비 중">
            <div class="adm-kpi-label">감면 1원당 국내 운용액</div>
            <div class="adm-kpi-value">-</div>
            <div class="adm-kpi-sub">예상 감면액 대비 국내 운용 평가액</div>
        </div>
    </section>

    <div class="adm-stat-cards">
        <!-- 세제혜택 상태 분포 -->
        <section class="adm-card">
            <div class="adm-card-head">
                <span class="adm-card-title">세제혜택 상태 분포 <span class="adm-card-sub">전체 <span id="statBenefitTotal">-</span>계좌</span></span>
            </div>
            <div class="adm-donut-wrap" id="accountBenefitWrap">
                <div class="adm-donut" id="accountBenefitChart">
                    <div class="adm-donut-hole">
                        <div>
                            <div class="adm-donut-label">적용 비율</div>
                            <div class="adm-donut-value" id="statBenefitRatio">-</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="adm-stat-table" id="accountBenefitTableWrap">
                <div class="adm-grid-scroll">
                    <table class="adm-gtable" style="--adm-cols: minmax(76px, 1fr) minmax(76px, 1fr) minmax(56px, 1fr)">
                        <thead>
                        <tr><th>구분</th><th class="is-r">계좌 수</th><th class="is-r">비중</th></tr>
                        </thead>
                        <tbody id="accountBenefitTable"></tbody>
                    </table>
                </div>
            </div>
            <div id="accountBenefitEmpty" class="adm-card-empty" hidden>
                <img th:src="@{/images/admin/char-front.png}" alt=""><span>데이터가 없습니다.</span>
            </div>
        </section>

        <!-- 나이대별 투자 비중 -->
        <section class="adm-card">
            <div class="adm-card-head">
                <span class="adm-card-title">나이대별 투자 비중 <span class="adm-card-sub">국내 재투자 금액 기준</span></span>
            </div>
            <div class="adm-age-bars" id="ageInvestmentChart"></div>
            <div class="adm-age-names" id="ageInvestmentNames"></div>
            <div class="adm-stat-table" id="ageInvestmentTableWrap">
                <div class="adm-grid-scroll">
                    <table class="adm-gtable" style="--adm-cols: minmax(76px, 1fr) minmax(56px, 1fr) minmax(96px, 1fr)">
                        <thead>
                        <tr><th>나이대</th><th class="is-r">비중</th><th class="is-r">추정 금액(억 원)</th></tr>
                        </thead>
                        <tbody id="ageInvestmentTable"></tbody>
                    </table>
                </div>
            </div>
            <div id="ageInvestmentEmpty" class="adm-card-empty" hidden>
                <img th:src="@{/images/admin/char-front.png}" alt=""><span>데이터가 없습니다.</span>
            </div>
        </section>

        <!-- 종목별 매수 비중 -->
        <section class="adm-card">
            <div class="adm-card-head">
                <span class="adm-card-title">종목별 매수 비중 <span class="adm-card-sub">RIA 국내 매수 금액 기준</span></span>
            </div>
            <div class="adm-stock-bars" id="productPurchaseChart"></div>
            <div class="adm-stat-table" id="productPurchaseTableWrap">
                <div class="adm-grid-scroll">
                    <table class="adm-gtable" style="--adm-cols: minmax(96px, 1fr) minmax(56px, 1fr)">
                        <thead>
                        <tr><th>종목</th><th class="is-r">비중</th></tr>
                        </thead>
                        <tbody id="productPurchaseTable"></tbody>
                    </table>
                </div>
            </div>
            <div id="productPurchaseEmpty" class="adm-card-empty" hidden>
                <img th:src="@{/images/admin/char-front.png}" alt=""><span>데이터가 없습니다.</span>
            </div>
        </section>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/admin/status-labels.js}"></script>
    <script th:src="@{/js/statistics.js}"></script>
</th:block>
</body>
</html>
