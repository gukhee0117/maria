name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Spotless
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:mariadb://localhost:1/ci
          DB_USERNAME: ci
          DB_PASSWORD: ci
          REDIS_HOST: localhost
          REDIS_PASSWORD: ci
          JWT_SECRET: Y2ktb25seS1mYWtlLXNlY3JldC0zMi1ieXRlcy1sb25nISE=
          EXIM_API_KEY: ci
          KIS_APP_KEY: ci
          KIS_APP_SECRET: ci
          RETURNS_SECURITY_URL: http://localhost:1
          MYDATA_URL: http://localhost:1
          CI_PEPPER: ci
